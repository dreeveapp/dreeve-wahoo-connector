services:
  wahoo-connector:
    # Build locally or pull pre-built image from GitHub Container Registry (GHCR)
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/dreeveapp/dreeve-wahoo-connector:latest
    container_name: dreeve-wahoo-connector
    restart: unless-stopped
    ports:
      - "${PORT:-8085}:8080"
    env_file:
      - .env
    environment:
      - WAHOO_CLIENT_ID=${WAHOO_CLIENT_ID}
      - WAHOO_CLIENT_SECRET=${WAHOO_CLIENT_SECRET}
      - WAHOO_REDIRECT_URI=${WAHOO_REDIRECT_URI:-https://localhost:8085/callback}
      - WAHOO_SCOPES=${WAHOO_SCOPES:-user_read workouts_read}
      - SYNC_TIME_WINDOW=${SYNC_TIME_WINDOW:-1_week}
      - SYNC_CRON=${SYNC_CRON:-0 2 * * *}
      - PORT=8080
      - DATA_DIR=/data
    volumes:
      - ./config:/data/config
      - ./activities:/data/downloads
